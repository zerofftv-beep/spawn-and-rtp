name: CustomEssentials
version: 1.0
main: com.customessentials.CustomEssentials
api-version: 1.20
depend: [WorldGuard, WorldEdit]
author: Custom

commands:
  spawn:
    description: Телепорт на спавн
    usage: /spawn
  setspawn:
    description: Установить точку спавна
    usage: /setspawn
    permission: customessentials.setspawn
  rtp:
    description: Рандомный телепорт
    usage: /rtp
  tppos:
    description: Телепорт по координатам
    usage: /tppos <x> <y> <z>
    permission: customessentials.tppos
  explosion:
    description: Включить/выключить ломание блоков в регионе
    usage: /explosion <on|off>
    permission: customessentials.explosion

permissions:
  customessentials.setspawn:
    default: op
  customessentials.tppos:
    default: op
  customessentials.explosion:
    default: op